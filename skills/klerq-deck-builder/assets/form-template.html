V.industries=()=>S.ind.sel.size?"":IND.length?"Tick at least one industry, or skip this chapter.":"There's nothing to choose here. Skip this chapter.";
const hlName=h=>h.n+(h.v?` (${h.v})`:"");
const SPL=x=>(x||"").split(/,\s*/).filter(Boolean);
const HLF=[{k:"t",l:"Work highlight commercial title",ty:"text",b:1,g:h=>h.n+" "+(h.v||"")+" "+(h.s||"")},{k:"c",l:"Companies",ty:"sel",b:1,g:h=>h.cs||[h.c]},{k:"sp",l:"Specialists",ty:"sel",b:1,g:h=>SPL(h.sp)},{k:"st",l:"Status",ty:"sel",b:1,g:h=>[h.st]},
{k:"m",l:"Matter internal name",ty:"text",g:h=>h.m||""},{k:"ind",l:"Industries",ty:"sel",g:h=>h.ind||[]},{k:"pr",l:"Practices",ty:"sel",g:h=>h.pr||[]},{k:"of",l:"Offices",ty:"sel",g:h=>h.of||[]},{k:"ms",l:"Matter status",ty:"sel",g:h=>[h.ms]},
{k:"sdf",l:"Start date from",ty:"date",g:h=>h.sd,op:">="},{k:"sdt",l:"Start date to",ty:"date",g:h=>h.sd,op:"<="},{k:"edf",l:"End date from",ty:"date",g:h=>h.ed,op:">="},{k:"edt",l:"End date to",ty:"date",g:h=>h.ed,op:"<="},
{k:"dmin",l:"Min deal value",ty:"num",g:h=>h.dvu!=null?h.dvu:h.dv,op:">="},{k:"dmax",l:"Max deal value",ty:"num",g:h=>h.dvl!=null?h.dvl:h.dv,op:"<="},
{k:"xb",l:"Cross border",ty:"yn",g:h=>h.xb},{k:"conf",l:"Confidential",ty:"yn",g:h=>h.conf},{k:"wl",l:"Work highlight labels",ty:"sel",g:h=>h.wl||[]},{k:"ml",l:"Matter label",ty:"sel",g:h=>h.ml||[]}];
S.hlv={f:{},adv:false,only:"",lim:25,open:-1};
function hlPass(h,f){for(const d of HLF){const val=f[d.k];if(val===undefined||val==="")continue;const x=d.g(h);
if(d.ty==="text"){if(!String(x||"").toLowerCase().includes(val.trim().toLowerCase()))return false;}
else if(d.ty==="sel"){if(!(x||[]).includes(val))return false;}
else if(d.ty==="yn"){if(!!x!==(val==="yes"))return false;}
else if(d.ty==="date"){if(!x)return false;const xs=String(x).slice(0,10);if(d.op===">="?xs<val:xs>val)return false;}
else if(d.ty==="num"){const n=parseFloat(String(val).replace(/[^\d.]/g,""));if(isNaN(n))continue;if(x==null)return false;if(d.op===">="?x<n:x>n)return false;}}return true;}
B.highlights=el=>{const v=S.hlv,uniq=a=>[...new Set(a.filter(Boolean))].sort((a,b)=>String(a).localeCompare(String(b)));
const ctl=d=>{const val=v.f[d.k]||"",id="hf_"+d.k;let c;
if(d.ty==="text")c=`<input type="text" id="${id}" data-hf="${d.k}" placeholder="${esc(d.l)}" value="${esc(val)}">`;
else if(d.ty==="sel"){const opts=uniq(HL.flatMap(d.g));c=`<select id="${id}" data-hf="${d.k}"><option value="">${esc(d.l)}${opts.length?"":" (none in KLERQ data)"}</option>${opts.map(o=>`<option${o===val?" selected":""}>${esc(o)}</option>`).join("")}</select>`;}
else if(d.ty==="yn")c=`<select id="${id}" data-hf="${d.k}"><option value="">${esc(d.l)}</option><option value="yes"${val==="yes"?" selected":""}>${esc(d.l)}: yes</option><option value="no"${val==="no"?" selected":""}>${esc(d.l)}: no</option></select>`;
else if(d.ty==="date")c=`<input type="date" id="${id}" data-hf="${d.k}" value="${esc(val)}" aria-label="${esc(d.l)}" title="${esc(d.l)}">`;
else c=`<input type="number" id="${id}" data-hf="${d.k}" placeholder="${esc(d.l)}" value="${esc(val)}" min="0" step="1">`;
return d.ty==="date"?`<label class="hfd"><span>${esc(d.l)}</span>${c}</label>`:c;};
const nAdv=HLF.filter(d=>!d.b&&v.f[d.k]).length,nAll=HLF.filter(d=>v.f[d.k]).length;
el.innerHTML=`<div class="hlbar"><div class="hfg">${HLF.filter(d=>d.b).map(ctl).join("")}</div>${v.adv?`<div class="hfg">${HLF.filter(d=>!d.b).map(ctl).join("")}</div>`:""}<div class="hlchipsbar"><button type="button" class="chip" id="hfadv" aria-expanded="${v.adv}">${v.adv?"Fewer filters ▴":`More filters${nAdv?` (${nAdv} on)`:""} ▾`}</button><button type="button" class="chip" id="hfclr" style="display:${nAll?"inline-block":"none"}">Clear filters</button><span style="flex:1"></span><button type="button" class="chip${v.only==="rec"?" on":""}" data-only="rec">Recommended</button><button type="button" class="chip${v.only==="sel"?" on":""}" data-only="sel">Selected</button></div></div><p class="cnt" id="hlc" style="margin-top:10px"></p><div id="hllist"></div>`;
const bar=()=>{const na=HLF.filter(d=>!d.b&&v.f[d.k]).length,nl=HLF.filter(d=>v.f[d.k]).length;$("hfclr").style.display=nl?"inline-block":"none";if(!v.adv)$("hfadv").textContent=`More filters${na?` (${na} on)`:""} ▾`;};
const draw=()=>{bar();const idx=HL.map((h,i)=>i).filter(i=>{const h=HL[i];if(v.only==="rec"&&!h.rec)return false;if(v.only==="sel"&&!S.hl.has(i))return false;return hlPass(h,v.f);});
$("hlc").textContent=`${S.hl.size} selected, one slide each · showing ${Math.min(idx.length,v.lim)} of ${idx.length}${idx.length!==HL.length?" matching":""}`;
$("hllist").innerHTML=idx.slice(0,v.lim).map(i=>{const h=HL[i],on=S.hl.has(i),op=v.open===i;
const ini=n=>n.split(/\s+/).filter(Boolean).map(w=>w[0]).slice(0,2).join("").toUpperCase();
const ppl=a=>a.map(n=>`<div class="hlp"><span class="av">${esc(ini(n))}</span>${esc(n)}</div>`).join("");
const chips=a=>`<div class="hlchips2">${a.map(x=>`<span class="ch">${esc(x)}</span>`).join("")}</div>`;
const ls=h.ls||SPL(h.sp).slice(0,1),ss=h.ss||SPL(h.sp).slice(1),comp=h.cs||[h.c];
const blk=(k,x)=>x?`<p class="hlk">${k}</p>${x}`:"";
const sum=h.s&&h.s!=="(no summary)"?h.s:"";
const long=sum.length>260;
const dates=[h.sd?"Start "+h.sd:"",h.ed?"End "+h.ed:""].filter(Boolean).join(" · ");
return `<div class="hlc${on?" on":""}"><div class="hlmain"><div class="hlpills"><span class="pill ${/draft/i.test(h.st)?"dr":"ap"}">● ${esc(h.st)}</span>${h.conf?'<span class="pill cf">Confidential</span>':""}${h.v?`<span class="pill vr">${esc(h.v)}</span>`:""}${h.rec?'<span class="pill rc">Recommended</span>':""}<label class="hlsel"><input type="checkbox" data-hl="${i}"${on?" checked":""}> ${on?"Selected":"Select"}</label></div><div class="hlt">${esc(h.n)}</div>${sum?`<p class="hls${op?"":" cl"}">${esc(sum)}</p>${long?`<button type="button" class="hlmore2" data-tg="${i}">${op?"Show less":"Show more"}</button>`:""}`:'<p class="hls" style="color:#8792A0!important">No summary in KLERQ.</p>'}${h.rec?`<p class="hlwhy">${esc(h.rec)}</p>`:""}</div><div class="hlside">${blk(comp.length>1?"Companies":"Company",ppl(comp.filter(Boolean)).replace(/class="av"/g,'class="av" style="border-radius:4px"'))}${blk("Lead specialists",ls.length?ppl(ls):"")}${blk("Supporting specialists",ss.length?ppl(ss):"")}${blk("Offices",h.of&&h.of.length?chips(h.of):"")}${blk("Practices",h.pr&&h.pr.length?chips(h.pr):"")}${blk("Industries",h.ind&&h.ind.length?chips(h.ind):"")}${h.m||dates?`<p class="hlmeta2">${h.m?esc(h.m):""}${h.m&&dates?"<br>":""}${esc(dates)}</p>`:""}</div></div>`;}).join("")+(idx.length>v.lim?`<button type="button" class="mini" id="hlmore">Show ${Math.min(25,idx.length-v.lim)} more</button>`:"")+(!idx.length?'<p class="pv">No highlights match these filters.</p>':"");
$("hllist").querySelectorAll("[data-hl]").forEach(c=>c.onchange=()=>{const i=+c.dataset.hl;c.checked?S.hl.add(i):S.hl.delete(i);S.cl.sel=null;draw();});
$("hllist").querySelectorAll("[data-tg]").forEach(b=>b.onclick=e=>{e.preventDefault();const i=+b.dataset.tg;v.open=v.open===i?-1:i;draw();});
const m=$("hlmore");if(m)m.onclick=e=>{e.preventDefault();v.lim+=25;draw();};};
el.querySelectorAll("[data-hf]").forEach(x=>{const f=()=>{v.f[x.dataset.hf]=x.value;v.lim=25;draw();};x.oninput=f;x.onchange=f;});
$("hfadv").onclick=e=>{e.preventDefault();v.adv=!v.adv;B.highlights(el);};
$("hfclr").onclick=e=>{e.preventDefault();v.f={};v.lim=25;B.highlights(el);};
el.querySelectorAll("[data-only]").forEach(b=>b.onclick=e=>{e.preventDefault();v.only=v.only===b.dataset.only?"":b.dataset.only;v.lim=25;B.highlights(el);});
draw();};
V.highlights=()=>S.hl.size?"":"Pick at least one highlight, or skip this chapter.";
B.clients=el=>{const fromHl=new Set([...S.hl].map(i=>HL[i].c));if(S.cl.sel===null)S.cl.sel=new Set(CL.filter(c=>fromHl.has(c)));
el.innerHTML=`<p class="cnt" id="clc"></p><div class="f"><input type="text" id="clf" placeholder="Filter clients" value="${esc(S.cl.f)}"></div><div id="cll" class="clgrid">`+CL.map((c,i)=>`<label class="chk" data-n="${esc(c.toLowerCase())}"><input type="checkbox" data-cl="${i}"${S.cl.sel.has(c)?" checked":""}> <span>${esc(c)}${fromHl.has(c)?'<span class="tag tg-rec">In your highlights</span>':""}</span></label>`).join("")+`</div>`;
const cnt=()=>$("clc").textContent=S.cl.sel.size+" selected";cnt();
const flt=()=>{const q=S.cl.f.toLowerCase();el.querySelectorAll("#cll .chk").forEach(l=>l.style.display=l.dataset.n.includes(q)?"flex":"none");};flt();
$("clf").oninput=e=>{S.cl.f=e.target.value;flt();};el.querySelectorAll("[data-cl]").forEach(c=>c.onchange=()=>{const n=CL[+c.dataset.cl];c.checked?S.cl.sel.add(n):S.cl.sel.delete(n);cnt();});};
V.clients=()=>S.cl.sel&&S.cl.sel.size?"":"Pick at least one client, or skip this chapter.";
B.additional=el=>{let h="";AD.filter(a=>S.ad[a.k]).forEach(a=>{const st=S.ad[a.k];h+=`<div class="card on" style="cursor:default"><div style="flex:1"><div class="t">${a.n}</div><p class="meta">${a.d}</p><div class="sub">`;
if(a.kind==="text")h+=textCards("ad_"+a.k,st,-1,"");else if(a.kind==="spec")h+=`<select data-adv="${a.k}">${SP.map(x=>`<option${st.v===x.n?" selected":""}>${esc(x.n)}</option>`).join("")}</select>`;else if(a.kind==="prac")h+=`<select data-adv="${a.k}">${PRAC.map(x=>`<option${st.v===x?" selected":""}>${esc(x)}</option>`).join("")}</select>`;else h+=`<p class="pv">This content isn't reachable from here. I'll look it up in KLERQ after you submit and show you the options.</p>`;
h+=`</div></div></div>`;});el.innerHTML=h||`<p class="pv">No extra chapters ticked.</p>`;
el.querySelectorAll("[data-adv]").forEach(s=>s.onchange=()=>S.ad[s.dataset.adv].v=s.value);
AD.forEach(a=>{if(S.ad[a.k]&&a.kind==="text")bindText(el,"ad_"+a.k,S.ad[a.k]);});};
V.additional=()=>{syncAd();return "";};
function sum(k){switch(k){case"preface":case"scope":case"firm":return textSum(S[k]);
case"specialists":return Object.entries(S.sp).map(([n,v])=>{const x=SP.find(s=>s.n===n);let b;if(v.bio==="ai")b="bio: Claude's version [see below]"+(v.aiEd!=null?" [edited in the form]":"");else if(v.bio===null)b="no bio"+(v.req?", Claude to write one":"");else b="bio: "+x.b[v.bio].n+" ["+x.b[v.bio].st+"]"+(v.ed&&v.ed[v.bio]!=null?" [edited, see below]":"")+(v.req?", Claude to tailor":"");return `${n} (${v.role}, ${b})`;}).join(" | ");
case"pricing":return prSum()||"(not filled in)";
case"practices":return [...(S.pc.sel||[])].join(" | ");
case"industries":return [...S.ind.sel].join(" | ");
case"highlights":return [...S.hl].sort((a,b)=>a-b).map(i=>`${hlName(HL[i])} [${HL[i].c}]`).join(" | ");
case"clients":return [...(S.cl.sel||[])].join(" | ");
default:{const a=AD.find(x=>x.k===k),st=S.ad[k];if(!a||!st)return"";return a.kind==="text"?textSum(st):a.kind==="none"?"Look up options after submit":st.v;}}}
function slides(k){return k==="highlights"?S.hl.size:1;}
B.overview=el=>{const inc=S.order.filter(k=>!S.skip[k]);const tot=1+inc.reduce((a,k)=>a+slides(k),0);
let h=`<p class="cnt">${inc.length+1} chapters · about ${tot} slides</p><div class="ov"><div style="flex:1"><div class="t">General information${AI.general?'<span class="tag tg-ai">✦ Claude</span>':""}</div><p class="pv">${esc(S.g.title)} · ${esc(S.g.client)}${S.g.about?" · "+esc(S.g.about):""}</p></div><button type="button" class="mini" data-ed="general">Edit</button></div>`;
S.order.forEach((k,i)=>{const off=!!S.skip[k];h+=`<div class="ov${off?" off":""}"><input type="checkbox" data-inc="${k}"${off?"":" checked"} aria-label="Include ${NM[k]}"><div style="flex:1"><div class="t">${NM[k]}${AI[k]&&!off?'<span class="tag tg-ai">✦ Claude</span>':""}</div><p class="pv">${off?"Left out":esc(sum(k)||"(nothing selected yet)")}</p></div><div style="display:flex;flex-direction:column;gap:4px;align-items:flex-end"><span><button type="button" class="mini" data-mv="${i}" data-d="-1" aria-label="Move up">↑</button> <button type="button" class="mini" data-mv="${i}" data-d="1" aria-label="Move down">↓</button></span><button type="button" class="mini" data-ed="${k}">Edit</button></div></div>`;});
el.innerHTML=h;
el.querySelectorAll("[data-inc]").forEach(c=>c.onchange=()=>{if(S.sent)return;c.checked?delete S.skip[c.dataset.inc]:S.skip[c.dataset.inc]=true;B.overview(el);});
el.querySelectorAll("[data-mv]").forEach(b=>b.onclick=()=>{if(S.sent)return;const i=+b.dataset.mv,j=i+ +b.dataset.d;if(j<0||j>=S.order.length)return;[S.order[i],S.order[j]]=[S.order[j],S.order[i]];B.overview(el);});
el.querySelectorAll("[data-ed]").forEach(b=>b.onclick=()=>{if(S.sent)return;const k=b.dataset.ed;if(CH.includes(k))delete S.skip[k];S.k=AD.some(a=>a.k===k)?"additional":k;S.ret=true;render();});};
V.overview=()=>{const bad=S.order.filter(k=>!S.skip[k]&&CH.includes(k)&&V[k]());return bad.length?`Finish or leave out: ${bad.map(k=>NM[k]).join(", ")}.`:"";};
B.export=el=>{el.innerHTML=`<p class="l" style="font-size:16px">Do you want to export to PowerPoint?</p><label class="chk"><input type="radio" name="exp" value="ppt"${S.exp==="ppt"?" checked":""}> Yes, fill my PowerPoint template</label><label class="chk"><input type="radio" name="exp" value="none"${S.exp==="none"?" checked":""}> No, only create it in KLERQ</label>${S.exp==="ppt"?`<div class="upl"><p class="t" style="font-size:14px;margin:0 0 4px">Upload your template here</p><p class="pv" style="margin:0">After you press Approve, attach your template (.pptx or .potx) to your next message with the paperclip in the chat. Claude fills it with this presentation and gives you the finished PowerPoint.</p></div>`:""}`;el.querySelectorAll("input[name=exp]").forEach(r=>r.onchange=()=>{S.exp=r.value;B.export(el);});};
V.export=()=>S.exp?"":"Choose Yes or No first.";
function buildText(){if(PH==="general"){const G=["[Presentation form] General","Title: "+S.g.title,"Client: "+S.g.client+(CL.includes(S.g.client.trim())?"":" (not in KLERQ)")];if(S.g.about)G.push("About: "+S.g.about);return G.join("\n");}const inc=S.order.filter(k=>!S.skip[k]),sk=S.order.filter(k=>S.skip[k]);const L=["[Presentation form] Approve","Title: "+S.g.title,"Client: "+S.g.client+(CL.includes(S.g.client.trim())?"":" (not in KLERQ)")];if(S.g.about)L.push("About: "+S.g.about);
L.push("Order: General information | "+inc.map(k=>NM[k]).join(" | "));if(sk.length)L.push("Left out: "+sk.map(k=>NM[k]).join(" | "));inc.forEach(k=>L.push(NM[k]+": "+sum(k)));L.push("Export: "+(S.exp==="ppt"?"PowerPoint, the user will attach their template":"none, only create it in KLERQ"));if(inc.includes("specialists"))Object.entries(S.sp).forEach(([n,v])=>{const x=SP.find(s=>s.n===n);if(v.bio==="ai")L.push("","--- Claude's bio: "+n+" ---",v.aiEd!=null?v.aiEd:(BD[n]||""),"--- end ---");else if(v.bio!==null&&v.ed&&v.ed[v.bio]!=null)L.push("","--- Edited bio: "+n+" ---",v.ed[v.bio],"--- end ---");});inc.forEach(k=>{const st=["preface","scope","firm"].includes(k)?S[k]:S.ad[k];if(st&&typeof st.c==="number"&&st.ed&&st.ed[st.c]!=null)L.push("","--- Edited text: "+NM[k]+" ---",st.ed[st.c],"--- end ---");if(st&&st.c==="ai")L.push("","--- Claude's draft: "+NM[k]+" ---",st.aiEd!=null?st.aiEd:(AIDR[k]||""),"--- end ---");});return L.join("\n");}
function trySend(txt){const m=$("sm");try{if(typeof sendPrompt!=="function")throw new Error("unavailable");sendPrompt(txt);m.textContent="Sent to the chat. If it doesn't appear there, copy the answers below and paste them in.";}catch(e){m.textContent="Couldn't send automatically. Copy the answers below and paste them into the chat.";}}
function send(){const txt=buildText();const box=document.createElement("div");box.className="sub";box.innerHTML=`<p class="l">${PH==="general"?"Your first chapter":"Your answers"}</p>${PH==="general"?'<p class="meta">The other chapters open in the next box as soon as this arrives.</p>':""}<p class="ok" id="sm"></p><textarea id="out" rows="10" readonly style="margin-top:8px">${esc(txt)}</textarea><div style="display:flex;gap:8px;flex-wrap:wrap"><button type="button" class="mini" id="cp">Copy answers</button><button type="button" class="mini" id="rs">Try sending again ↗</button></div><p class="meta" id="cpm"></p>`;$("body").appendChild(box);
$("cp").onclick=()=>{const t=$("out");t.focus();t.select();let ok=false;try{ok=document.execCommand("copy");}catch(e){}const done=r=>$("cpm").textContent=r?"Copied. Paste it into the chat.":"Select the text above and copy it with Ctrl+C or Cmd+C.";if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(ok));else done(ok);};
$("rs").onclick=()=>trySend(txt);trySend(txt);box.scrollIntoView({block:"nearest"});}
function render(){const L=ST(),k=S.k,i=Math.max(0,L.indexOf(k));
app.innerHTML=`<p class="eb">Step ${i+1} of ${L.length}${S.g.client?" · "+esc(S.g.client):""}</p><div class="bar"><i style="width:${Math.round((i+1)/L.length*100)}%"></i></div><h3>${NM[k]}</h3><p class="s">${HINT[k]}</p><div id="body"></div><p class="err" id="err"></p><div class="row">${i>0?'<button type="button" class="sk" id="back" style="margin-right:auto">← Back</button>':""}${CH.includes(k)?'<button type="button" class="sk" id="skip">Skip this chapter</button>':""}<button type="button" class="go" id="go">${k==="export"?"Approve and send ↗":S.ret?"Back to overview →":"Continue →"}</button></div>`;
B[k]($("body"));if(AI[k]&&k!=="brief")$("body").insertAdjacentHTML("afterbegin",`<div class="ai"><span aria-hidden="true">✦</span><span><b>Filled in by Claude from your brief.</b> ${esc(AI[k])}</span></div>`);
const nxt=(from)=>{const LL=from||ST();if(S.ret&&k!=="overview"&&k!=="export"){S.ret=false;S.k="overview";}else S.k=LL[LL.indexOf(k)+1]||"overview";render();app.scrollIntoView({block:"nearest"});};
if($("back"))$("back").onclick=()=>{if(S.sent)return;const LL=ST();S.k=LL[Math.max(0,LL.indexOf(k)-1)];S.ret=false;render();};
if($("skip"))$("skip").onclick=()=>{const LL=ST();S.skip[k]=true;nxt(LL);};
$("go").onclick=()=>{if(S.sent)return;const e=V[k]();if(e){$("err").textContent=e;return;}$("err").textContent="";if(CH.includes(k))delete S.skip[k];if(k==="export"||PH==="general"){S.sent=true;$("go").textContent="Sent ✓";send();return;}nxt();};}
render();
</script>
