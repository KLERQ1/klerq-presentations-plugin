<!doctype html><html><head><meta charset="utf-8"><title>mock MCP Apps host</title></head>
<body>
<pre id="log">starting</pre>
<iframe id="view" style="width:900px;height:900px;border:1px solid #999"></iframe>
<script>
// Minimal MCP Apps host: answers ui/initialize, sends tool-input + tool-result, records ui/message.
const q = new URLSearchParams(location.search);
const page = q.get("page") || "form.html";
const log = (m) => { document.getElementById("log").textContent += "\n" + m; };
const results = { initialized: false, sizeChanged: 0, messages: [], formTitle: null, briefText: null, errors: [] };
window.__results = results;
const sample = {"phase":"rest","brief":"We are preparing a presentation for Van Doorne about faster pitching.","ai":{"general":"Client from your brief."},"aiFields":["client","title","about"],"chapters":["preface","specialists","highlights","clients"],"general":{"client":"Van Doorne","title":"KLERQ for Van Doorne","about":"Faster pitching with KLERQ."},"clients":["Van Doorne","Orka"],"texts":[{"n":"Preface","src":"Meet KLERQ","c":"","cs":false,"t":"KLERQ helps law firms pitch faster."}],"textRecs":{"preface":[0,"Neutral firm text."]},"specialists":[{"n":"Jorn Vermeulen","r":"CEO","p":["Law firm positioning"],"b":[{"n":"English bio","st":"Approved","t":"Bio."}],"rec":"Named in your brief"}],"industries":[],"highlights":[{"n":"Faster Pitching","v":"","c":"Ellex","cs":["Ellex"],"st":"Approved","conf":false,"s":"Summary","ls":["Jorn Vermeulen"],"ss":[],"sp":"Jorn Vermeulen","m":"Ellex","ms":"Completed","sd":"2025-01-01","ed":"","rec":"Fits the topic"}]};
const view = document.getElementById("view");
const send = (msg) => view.contentWindow.postMessage(msg, "*");
window.addEventListener("message", (ev) => {
  const m = ev.data; if (!m || m.jsonrpc !== "2.0") return;
  if (m.method === "ui/initialize") {
    log("got ui/initialize from " + m.params.appInfo.name + " protocol " + m.params.protocolVersion);
    send({ jsonrpc: "2.0", id: m.id, result: { protocolVersion: "2026-01-26", hostInfo: { name: "mock-host", version: "1" }, hostCapabilities: {}, hostContext: { theme: "dark", displayMode: "inline" } } });
  } else if (m.method === "ui/notifications/initialized") {
    results.initialized = true; log("initialized");
    const args = page === "brief.html" ? {} : { data: sample };
    send({ jsonrpc: "2.0", method: "ui/notifications/tool-input", params: { arguments: args } });
    send({ jsonrpc: "2.0", method: "ui/notifications/tool-result", params: { content: [{ type: "text", text: "ok" }], _meta: page === "brief.html" ? {} : { "klerq/data": sample } } });
    setTimeout(inspect, 600);
  } else if (m.method === "ui/notifications/size-changed") {
    results.sizeChanged++;
  } else if (m.method === "ui/message") {
    results.messages.push(m.params.content[0].text); log("ui/message: " + m.params.content[0].text.slice(0, 80).replace(/\n/g, " | "));
    send({ jsonrpc: "2.0", id: m.id, result: {} });
  } else if (m.method === "ping") { send({ jsonrpc: "2.0", id: m.id, result: {} }); }
});
function inspect() {
  try {
    const d = view.contentDocument;
    const h3 = d.querySelector(".kq h3"); results.formTitle = h3 && h3.textContent;
    const app = d.getElementById("app"); results.appText = app && app.textContent.slice(0, 120);
    const br = d.getElementById("br"); results.briefText = br && br.value.slice(0, 60);
    if (page === "brief.html" && br) {
      // Fill the brief and press Continue: expect a ui/message.
      br.value = "We are preparing a presentation for Van Doorne. It is about faster pitching. Jorn leads. Deadline 15 October.";
      d.getElementById("go").click();
    } else if (page === "form.html") {
      // Press Continue on the first step (general information) to check the form is interactive.
      const go = d.getElementById("go"); if (go) { go.click(); results.afterContinue = (d.querySelector(".kq h3") || {}).textContent; }
    }
  } catch (e) { results.errors.push(String(e)); }
  setTimeout(() => { log("RESULT " + JSON.stringify(results)); }, 500);
}
view.src = "/preview/" + page;
</script></body></html>
